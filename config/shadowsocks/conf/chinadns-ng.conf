# /config/shadowsocks/conf/chinadns-ng.conf
# chinadns-ng 配置(替代旧 chinadns + pdnsd)
#
# DNS 分流逻辑(default-tag none,IP 判定):
#   查询同时发给国内(china-dns)与可信(trust-dns)上游;
#   若应答 IP 命中 ipset "chnroute"(由 init 脚本从 chnroute.txt 载入)
#   → 采用国内应答,否则采用可信应答(tcp://8.8.8.8 经 SS 隧道)。
#
# dnsmasq 需指向本机 127.0.0.1#5301(install.sh 已通过 config tree 设置)。

bind-addr 127.0.0.1
bind-port 5301

# 国内上游(直连)
china-dns 114.114.114.114

# 可信上游:TCP 查询,经 iptables REDIRECT 走 SS 隧道(pdnsd 的替代)
trust-dns tcp://8.8.8.8

# 用 chnroute.txt 判定应答 IP 归属(ipset 由 init 脚本创建)
ipset-name4 chnroute

# DNS 缓存
cache 4096
cache-stale 86400
cache-refresh 20
